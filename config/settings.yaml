# Risk Radar Configuration
# Non-secret application settings only. Credentials and Telegram routing are
# loaded from environment variables listed in .env.example.

# Factor ETFs
factor_etfs:
  - name: rates
    symbol: TLT
    description: "Duration / rate sensitivity"
  - name: credit
    symbol: HYG
    description: "HY spread / deleveraging"
  - name: dollar
    symbol: UUP
    description: "DXY / FX translation"
  - name: ai_tech
    symbol: SMH
    description: "Semiconductor / AI beta"
  - name: quality
    symbol: QUAL
    description: "Quality factor crowding"
  - name: momentum
    symbol: MTUM
    description: "Momentum crowding"
  - name: market
    symbol: SPY
    description: "Beta baseline"
  - name: low_vol
    symbol: USMV
    description: "Defensive positioning"
  - name: value
    symbol: VTV
    description: "Value factor"

# Engine Parameters
rolling_window: 60          # Trading days for factor regression
ewma_span: 60               # EWMA span for correlation
ar_lookback: 252             # Lookback for Absorption Ratio PCA
heat_update_interval_seconds: 300  # 5 minutes between updates

# Heat Score Weights
heat_weight_absorption_ratio: 0.25
heat_weight_turbulence: 0.20
heat_weight_diversification: 0.20
heat_weight_factor_hhi: 0.15
heat_weight_avg_correlation: 0.20

# Alert thresholds from scripts/run_backtest.py (2019-04-01 through 2026-09-04)
heat_threshold_warm: 0.4636
heat_threshold_hot: 0.6732
heat_threshold_critical: 0.8029
heat_threshold_emergency: 0.8781

# Data Pipeline
data_source_priority:
  - polygon
  - yfinance
  - cache
polygon_tier: "free"           # free, starter, developer, advanced
data_cache_ttl_seconds: 300    # 5 minutes

# Alert Cooldowns (minutes)
alert_cooldown_daily_summary: 1440   # 24 hours
alert_cooldown_level_change: 30       # 30 minutes
alert_cooldown_threshold_cross: 60    # 1 hour
alert_cooldown_regime_shift: 15       # 15 minutes
alert_cooldown_emergency: 0           # No cooldown

# Storage
duckdb_path: "data/riskradar.duckdb"
redis_url: "redis://localhost:6379"

# Server
host: "127.0.0.1"
port: 8000
