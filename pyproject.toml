[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riskradar"
version = "0.1.0"
description = "Portfolio-level latent factor risk engine for algorithmic trading"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.34.0",
    "duckdb>=1.5.0",
    "redis>=5.0.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "yfinance>=0.2.40",
    "polygon-api-client>=1.14.0",
    "fredapi>=0.5",
    "httpx>=0.27",
    "websockets>=14.0",
    "arch>=8.0",
    "networkx>=3.0",
    "python-louvain>=0.16",
    "riskfolio-lib>=7.0",
    "hmmlearn>=0.3.0",
    "ruptures>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["--ignore=tests/holdout", "-m", "not network"]
markers = ["network: explicit public-network integration test; excluded from blocking suite"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py312"
line-length = 100
